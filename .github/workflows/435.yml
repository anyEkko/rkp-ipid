name: 编译rkp-ipid模块 (JDCloud RE-SS-01/aarch64)

on:
  workflow_dispatch:
    inputs:
      kernelVersion:
        description: '设备内核版本'
        required: true
        default: '6.1.34'

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # 直接使用系统安装的aarch64交叉编译器（核心）
      CROSS_COMPILE: aarch64-linux-gnu-
      ARCH: aarch64

    steps:
      - name: 检查rkp-ipid源码
        uses: actions/checkout@v4
        with:
          path: rkp-ipid
          fetch-depth: 1

      - name: 安装系统级aarch64交叉编译器（关键）
        run: |
          sudo apt update -y && sudo apt upgrade -y
          # 安装完整的aarch64交叉编译工具链（不依赖SDK工具链）
          sudo apt install -y \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget \
            unzip python3 python3-distutils file flex bison \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            zstd linux-headers-${{ env.ARCH }}  # 安装aarch64内核头文件
          # 验证编译器是否可用
          if ! command -v ${{ env.CROSS_COMPILE }}gcc &> /dev/null; then
            echo "错误：aarch64交叉编译器安装失败"
            exit 1
          fi
          echo "交叉编译器就绪：${{ env.CROSS_COMPILE }}gcc"

      - name: 下载并解压通用SDK（仅用其内核头文件和Makefile）
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget --no-check-certificate -c --progress=bar:force $SDK_URL -O sdk.tar.zst
          [ -f "sdk.tar.zst" ] && [ $(stat -c%s "sdk.tar.zst") -gt 1024000 ] || { echo "SDK无效"; exit 1; }
          
          rm -rf sdk
          tar --use-compress-program=zstd -xf sdk.tar.zst
          TOP_DIR=$(ls -d immortalwrt-sdk-*)
          mv "$TOP_DIR" sdk
          echo "SDK解压完成，仅使用其内核配置文件"

      - name: 简化配置（仅保留rkp-ipid编译必需参数）
        run: |
          # 复制rkp-ipid到SDK包目录
          mkdir -p sdk/package/rkp-ipid
          cp -r rkp-ipid/* sdk/package/rkp-ipid/
          
          cd sdk
          # 仅配置编译rkp-ipid必需的参数（忽略其他依赖）
          cat > .config << EOF
          CONFIG_ARCH=${{ env.ARCH }}
          CONFIG_CROSS_COMPILE=${{ env.CROSS_COMPILE }}
          CONFIG_KERNEL_PATCHVER=${{ github.event.inputs.kernelVersion }}
          CONFIG_PACKAGE_kmod-rkp-ipid=y
          CONFIG_MODULES=y
          CONFIG_KERNEL_BUILD_DIR=$(pwd)/build_dir/target-${{ env.ARCH }}_cortex-a53_musl/linux-*/
          EOF
          
          # 生成基础配置（忽略无关依赖警告）
          make defconfig IGNORE_ERRORS=1  # IGNORE_ERRORS忽略固件依赖警告

      - name: 编译rkp-ipid模块（直接用系统交叉编译器）
        id: compile
        run: |
          cd sdk
          # 关键：直接编译模块，不依赖SDK工具链，忽略无关错误
          make package/rkp-ipid/compile \
            ARCH=${{ env.ARCH }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            KERNEL_PATCHVER=${{ github.event.inputs.kernelVersion }} \
            IGNORE_ERRORS=1 \  # 忽略固件依赖警告
            -j4 V=sc
          
          # 搜索所有aarch64架构的ipk产物（通用SDK路径不固定）
          echo "=== 搜索ipk产物 ==="
          IPK_FILE=$(find . -name "kmod-rkp-ipid_*.ipk" | grep -E "${{ env.ARCH }}|arm64" | head -n1)
          
          if [ -z "$IPK_FILE" ]; then
            echo "未找到产物，打印所有ipk文件："
            find . -name "*.ipk" | grep -E "${{ env.ARCH }}|arm64"
            exit 1
          fi
          
          echo "找到aarch64产物：$IPK_FILE"
          echo "ipk_path=$IPK_FILE" >> $GITHUB_OUTPUT

      - name: 上传最终产物
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kmod-rkp-ipid-${{ env.ARCH }}-${{ github.event.inputs.kernelVersion }}
          path: ${{ steps.compile.outputs.ipk_path }}
          retention-days: 30

      - name: 上传错误日志
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs-final
          path: |
            sdk/logs/
            sdk/build_dir/target-${{ env.ARCH }}_cortex-a53_musl/linux-*/rkp-ipid-*/
            sdk/.config
          retention-days: 7
