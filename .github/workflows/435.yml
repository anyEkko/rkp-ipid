name: 编译rkp-ipid模块 (JDCloud RE-SS-01/aarch64)

on:
  workflow_dispatch:
    inputs:
      unused:
        description: '无需输入，直接触发'
        required: false
        default: '触发编译'

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ARCH: aarch64
      # 关键：内核模块包必须放在SDK的package/kernel/目录下
      SDK_PACKAGE_PATH: sdk/package/kernel/rkp-ipid

    steps:
      - name: 检查源码结构（确保符合标准）
        uses: actions/checkout@v4
        with:
          path: rkp-ipid-src
          fetch-depth: 1
      - run: |
          # 验证本地源码结构
          echo "=== 本地源码结构 ==="
          ls -l rkp-ipid-src/
          ls -l rkp-ipid-src/src/
          [ -f "rkp-ipid-src/src/rkp-ipid.c" ] || { echo "错误：缺失src/rkp-ipid.c"; exit 1; }
          [ -f "rkp-ipid-src/Makefile" ] || { echo "错误：缺失Makefile"; exit 1; }

      - name: 安装依赖
        run: |
          sudo apt-get update --quiet=2
          sudo apt-get install --yes --quiet=2 \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget \
            unzip python3 python3-distutils file flex bison \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zstd

      - name: 下载并解压SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget --no-check-certificate -c --progress=bar:force $SDK_URL -O sdk.tar.zst
          [ -f "sdk.tar.zst" ] && [ $(stat -c%s "sdk.tar.zst") -gt 1024000 ] || { echo "SDK无效"; exit 1; }
          rm -rf sdk
          tar --use-compress-program=zstd -xf sdk.tar.zst
          TOP_DIR=$(ls -d immortalwrt-sdk-*)
          mv "$TOP_DIR" sdk

      - name: 复制包到SDK正确路径（关键：package/kernel/）
        run: |
          # 内核模块必须放在package/kernel/下，SDK才会扫描
          mkdir -p $(SDK_PACKAGE_PATH)
          # 复制源码和Makefile到正确路径
          cp -r rkp-ipid-src/* $(SDK_PACKAGE_PATH)/
          # 验证SDK中的包结构
          echo "=== SDK中包的结构 ==="
          ls -l $(SDK_PACKAGE_PATH)/
          ls -l $(SDK_PACKAGE_PATH)/src/

      - name: 强化Feeds配置（确保包被收录）
        run: |
          cd sdk
          # 1. 清除旧Feeds缓存
          rm -rf feeds/packages/feeds.conf
          # 2. 更新Feeds（强制重新扫描所有包目录）
          ./scripts/feeds update -a -f  # -f强制刷新
          # 3. 安装rkp-ipid包（显式指定路径，避免遗漏）
          ./scripts/feeds install -d y -p kernel rkp-ipid  # -d y：默认安装，-p kernel：指定包所在分类
          # 4. 验证包是否被成功安装（检查Feeds索引）
          if ! grep -q "kmod-rkp-ipid" feeds/index.txt; then
            echo "错误：Feeds未收录kmod-rkp-ipid包"
            cat feeds/index.txt | grep -i rkp-ipid  # 打印相关记录排查
            exit 1
          fi
          echo "Feeds成功收录kmod-rkp-ipid包"

      - name: 配置SDK（显式启用包）
        run: |
          cd sdk
          # 生成基础配置（指定aarch64架构+启用内核模块）
          cat > .config << EOF
          CONFIG_TARGET_ARCH=$(ARCH)
          CONFIG_TARGET_ARCH_PACKAGES=$(ARCH)_cortex-a53
          CONFIG_MODULES=y
          CONFIG_KERNEL_MODULES=y
          CONFIG_PACKAGE_kmod-rkp-ipid=y  # 显式启用包
          CONFIG_PACKAGE_kmod-nf-iptables=y  # 满足包的依赖
          EOF
          # 确认配置（处理依赖关系）
          make oldconfig -j1  # 自动处理依赖，避免配置冲突
          # 验证配置是否生效
          if ! grep -q "CONFIG_PACKAGE_kmod-rkp-ipid=y" .config; then
            echo "错误：.config未启用kmod-rkp-ipid"
            cat .config | grep -i rkp-ipid
            exit 1
          fi

      - name: 编译kmod-rkp-ipid（SDK已识别目标）
        id: compile
        run: |
          cd sdk
          # 编译包（此时SDK已识别compile目标）
          make package/kernel/rkp-ipid/compile -j4 V=sc  # 明确指定包路径：kernel/rkp-ipid
          
          # 验证.ko文件生成
          BUILD_DIR=$(find build_dir/target-$(ARCH)_cortex-a53_musl/linux-*/kernel/rkp-ipid-* -type d | head -n1)
          if [ -z "$BUILD_DIR" ] || [ ! -f "$BUILD_DIR/rkp-ipid.ko" ]; then
            echo "错误：未生成rkp-ipid.ko"
            [ -n "$BUILD_DIR" ] && cat "$BUILD_DIR/.compile.log"  # 打印编译日志
            exit 1
          fi
          echo "成功生成.ko模块：$BUILD_DIR/rkp-ipid.ko"
          
          # 查找ipk产物
          IPK_FILE=$(find bin/packages/$(ARCH)_cortex-a53/kernel/ -name "kmod-rkp-ipid_*.ipk" | head -n1)
          if [ -z "$IPK_FILE" ]; then
            echo "=== 显示bin目录结构 ==="
            ls -l bin/packages/$(ARCH)_cortex-a53/kernel/
            exit 1
          fi
          echo "ipk_path=$IPK_FILE" >> $GITHUB_OUTPUT

      - name: 上传ipk产物
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kmod-rkp-ipid-${{ env.ARCH }}-6.1.x
          path: ${{ steps.compile.outputs.ipk_path }}
          retention-days: 30

      - name: 上传错误日志
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs-final
          path: |
            sdk/logs/
            sdk/build_dir/target-${{ env.ARCH }}_cortex-a53_musl/linux-*/kernel/rkp-ipid-*/
            sdk/feeds/index.txt
          retention-days: 7
