name: 编译rkp-ipid模块 (适配JDCloud RE-SS-01)

on:
  workflow_dispatch:
    inputs:
      kernelVersion:
        description: '设备内核版本'
        required: true
        default: '6.1.34'

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 180  # 延长超时，确保工具链编译完成

    steps:
      - name: 检查rkp-ipid源码
        uses: actions/checkout@v4
        with:
          path: rkp-ipid
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install -y \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget \
            unzip python3 python3-distutils file flex bison \
            gcc-aarch64-linux-gnu ninja-build cmake zstd

      - name: 下载SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget --no-check-certificate -c --progress=bar:force $SDK_URL -O sdk.tar.zst
          [ -f "sdk.tar.zst" ] && [ $(stat -c%s "sdk.tar.zst") -gt 1024000 ] || { echo "SDK下载无效"; exit 1; }

      - name: 解压SDK
        run: |
          rm -rf sdk
          tar --use-compress-program=zstd -xf sdk.tar.zst
          TOP_DIR=$(ls -d immortalwrt-sdk-*)
          mv "$TOP_DIR" sdk
          [ -d "sdk/target/qualcommax/ipq60xx" ] || { echo "SDK无ipq60xx平台配置"; exit 1; }
          echo "SDK解压成功，平台目录：sdk/target/qualcommax/ipq60xx"

      - name: 配置编译环境（指定qualcommax/ipq60xx平台）
        run: |
          # 复制rkp-ipid到SDK
          mkdir -p sdk/package/rkp-ipid
          cp -r rkp-ipid/* sdk/package/rkp-ipid/
          
          cd sdk
          # 关键：完整指定目标平台（解决产物目录错误的核心）
          echo "CONFIG_TARGET_BOARD=qualcommax" >> .config
          echo "CONFIG_TARGET_SUBTARGET=ipq60xx" >> .config
          echo "CONFIG_TARGET_PROFILE=DEVICE_generic" >> .config
          echo "CONFIG_TARGET_ARCH=aarch64" >> .config
          echo "CONFIG_TARGET_ARCH_PACKAGES=aarch64_cortex-a53" >> .config
          # 启用模块+锁定内核版本
          echo "CONFIG_PACKAGE_kmod-rkp-ipid=y" >> .config
          echo "CONFIG_KERNEL_PATCHVER=${{ github.event.inputs.kernelVersion }}" >> .config
          
          # 生成最终配置（基于指定的平台参数）
          make defconfig
          
          # 打印配置确认（关键参数是否生效）
          echo "=== 目标平台配置确认 ==="
          cat .config | grep -E "TARGET_BOARD|TARGET_SUBTARGET|TARGET_ARCH|KERNEL_PATCHVER"

      - name: 初始化编译环境（生成工具链和依赖）
        run: |
          cd sdk
          # 先编译工具链和基础依赖（否则产物目录不生成）
          make tools/install toolchain/install -j4 V=sc

      - name: 编译rkp-ipid模块（生成产物到targets目录）
        id: compile
        run: |
          cd sdk
          # 编译模块并安装到产物目录
          make package/rkp-ipid/install -j4 V=sc
          
          # 关键：搜索ImmortalWrt标准产物目录（qualcommax/ipq60xx/packages）
          IPK_FILE=$(find bin/targets/qualcommax/ipq60xx/packages/ -name "kmod-rkp-ipid_*.ipk" | head -n1)
          
          # 打印bin目录完整结构（方便排查路径）
          echo "=== bin目录结构 ==="
          ls -l bin/
          ls -l bin/targets/qualcommax/ipq60xx/
          
          if [ -z "$IPK_FILE" ]; then
            echo "错误：未找到ipk产物"
            exit 1
          fi
          echo "找到产物：$IPK_FILE"
          echo "ipk_path=$IPK_FILE" >> $GITHUB_OUTPUT

      - name: 上传编译产物
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kmod-rkp-ipid-${{ github.event.inputs.kernelVersion }}-ipq60xx
          path: ${{ steps.compile.outputs.ipk_path }}
          retention-days: 30

      - name: 上传错误日志
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs-${{ github.run_id }}
          path: |
            sdk/logs/
            sdk/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq60xx/rkp-ipid-*/
          retention-days: 7
