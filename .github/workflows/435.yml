name: 编译rkp-ipid模块 (JDCloud RE-SS-01/aarch64)

on:
  workflow_dispatch:
    inputs:
      unused:
        description: '无需输入，直接触发'
        required: false
        default: '触发编译'

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ARCH: aarch64

    steps:
      - name: 检查rkp-ipid源码（含标准Makefile）
        uses: actions/checkout@v4
        with:
          path: rkp-ipid
          fetch-depth: 1
      - run: |
          # 确认重构后的Makefile存在且包含关键字段
          echo "=== 验证Makefile是否符合KernelPackage规范 ==="
          grep -E "KernelPackage|FILES|AUTOLOAD|SUBMENU" rkp-ipid/Makefile
          [ -f "rkp-ipid/src/rkp-ipid.c" ] || { echo "缺失rkp-ipid.c"; exit 1; }
          [ -f "rkp-ipid/Makefile" ] || { echo "缺失Makefile"; exit 1; }

      - name: 安装依赖
        run: |
          sudo apt-get update --quiet=2
          sudo apt-get install --yes --quiet=2 \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget \
            unzip python3 python3-distutils file flex bison \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zstd

      - name: 下载并解压SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget --no-check-certificate -c --progress=bar:force $SDK_URL -O sdk.tar.zst
          [ -f "sdk.tar.zst" ] && [ $(stat -c%s "sdk.tar.zst") -gt 1024000 ] || { echo "SDK无效"; exit 1; }
          rm -rf sdk
          tar --use-compress-program=zstd -xf sdk.tar.zst
          TOP_DIR=$(ls -d immortalwrt-sdk-*)
          mv "$TOP_DIR" sdk

      - name: 配置SDK（识别内核模块包）
        run: |
          # 复制带标准Makefile的rkp-ipid到SDK
          mkdir -p sdk/package/rkp-ipid
          cp -r rkp-ipid/* sdk/package/rkp-ipid/
          
          cd sdk
          # 1. 更新feeds（SDK识别新包的必要步骤）
          ./scripts/feeds update -a > /dev/null
          ./scripts/feeds install -y kmod-rkp-ipid  # 显式安装rkp-ipid包
          
          # 2. 生成基础配置（指定aarch64架构）
          cat > .config << EOF
          CONFIG_TARGET_ARCH=$(ARCH)
          CONFIG_TARGET_ARCH_PACKAGES=$(ARCH)_cortex-a53
          CONFIG_MODULES=y
          CONFIG_PACKAGE_kmod-rkp-ipid=y  # 启用rkp-ipid包
          EOF
          make defconfig  # 生成SDK可识别的配置

      - name: 编译并生成ipk（SDK自动识别install目标）
        id: compile
        run: |
          cd sdk
          # 1. 编译模块（SDK会生成compile目标，再自动打包为ipk）
          make package/kmod-rkp-ipid/compile -j4 V=sc  # V=sc显示详细日志
          
          # 2. 确认.ko文件生成（编译成功的标志）
          BUILD_DIR=$(find build_dir/target-$(ARCH)_cortex-a53_musl/linux-*/ -name "rkp-ipid-*")
          if [ -z "$BUILD_DIR" ] || [ ! -f "$BUILD_DIR/rkp-ipid.ko" ]; then
            echo "错误：未生成rkp-ipid.ko模块文件"
            exit 1
          fi
          echo "模块文件生成成功：$BUILD_DIR/rkp-ipid.ko"
          
          # 3. 查找ipk产物（标准路径：bin/packages/架构/base/）
          IPK_FILE=$(find bin/packages/$(ARCH)_cortex-a53/base/ -name "kmod-rkp-ipid_*.ipk" | head -n1)
          if [ -z "$IPK_FILE" ]; then
            echo "=== 未找到ipk，显示bin目录结构 ==="
            ls -l bin/packages/$(ARCH)_cortex-a53/
            exit 1
          fi
          echo "ipk_path=$IPK_FILE" >> $GITHUB_OUTPUT

      - name: 上传ipk产物
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kmod-rkp-ipid-${{ env.ARCH }}-v1.2
          path: ${{ steps.compile.outputs.ipk_path }}
          retention-days: 30

      - name: 上传错误日志
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs-final
          path: |
            sdk/logs/
            sdk/build_dir/target-${{ env.ARCH }}_cortex-a53_musl/linux-*/rkp-ipid-*/
            sdk/package/rkp-ipid/Makefile
          retention-days: 7
