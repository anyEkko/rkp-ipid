name: 编译rkp-ipid模块 (适配JDCloud RE-SS-01)

on:
  workflow_dispatch:
    inputs:
      kernelVersion:
        description: '设备内核版本'
        required: true
        default: '6.1.34'  # 你的设备内核版本

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 120  # 足够的编译时间

    steps:
      - name: 检查rkp-ipid源码
        uses: actions/checkout@v4
        with:
          path: rkp-ipid
          fetch-depth: 1

      - name: 安装编译依赖（含zstd解压工具）
        run: |
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install -y \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget \
            unzip python3 python3-distutils file flex bison \
            gcc-aarch64-linux-gnu ninja-build cmake zstd  # 新增zstd支持.tar.zst格式

      - name: 下载新SDK（固定有效链接）
        run: |
          # 使用你提供的新SDK链接（.tar.zst格式）
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          
          # 下载SDK（带进度条，断点续传）
          wget --no-check-certificate -c --progress=bar:force \
            $SDK_URL -O sdk.tar.zst
          
          # 验证文件存在
          if [ ! -f "sdk.tar.zst" ]; then
            echo "SDK下载失败，文件不存在"
            exit 1
          fi

      - name: 解压.zst格式SDK
        run: |
          # 创建SDK目录
          mkdir -p sdk
          
          # 使用zstd解压（适配.tar.zst格式）
          tar --use-compress-program=zstd -xf sdk.tar.zst -C sdk --strip-components=1
          
          # 验证解压成功（检查关键目录）
          if [ ! -d "sdk/package" ]; then
            echo "SDK解压失败，关键目录缺失"
            exit 1
          fi

      - name: 配置编译环境（适配ipq60xx）
        run: |
          # 复制rkp-ipid到SDK的package目录
          mkdir -p sdk/package/rkp-ipid
          cp -r rkp-ipid/* sdk/package/rkp-ipid/
          
          cd sdk
          # 更新依赖源
          ./scripts/feeds update -a > /dev/null
          ./scripts/feeds install -a > /dev/null
          
          # 加载ipq60xx平台默认配置
          cp configs/immortalwrt_qualcommax_ipq60xx_defconfig .config
          
          # 启用rkp-ipid编译+锁定内核版本
          echo "CONFIG_PACKAGE_kmod-rkp-ipid=y" >> .config
          echo "CONFIG_KERNEL_PATCHVER=${{ github.event.inputs.kernelVersion }}" >> .config
          
          # 生成最终编译配置
          make defconfig

      - name: 编译rkp-ipid模块
        id: compile
        run: |
          cd sdk
          # 显示关键配置（调试用）
          echo "=== 编译配置确认 ==="
          cat .config | grep -E "KERNEL_PATCHVER|rkp-ipid|aarch64"
          
          # 限制4线程编译（避免GitHub内存溢出）
          make package/rkp-ipid/compile V=sc -j4
          
          # 查找aarch64架构的ipk产物
          IPK_FILE=$(find bin/packages/aarch64_cortex-a53/base/ -name "kmod-rkp-ipid_*.ipk" | head -n1)
          if [ -z "$IPK_FILE" ]; then
            echo "错误：未找到编译后的ipk文件"
            exit 1
          fi
          
          echo "ipk_path=$IPK_FILE" >> $GITHUB_OUTPUT

      - name: 上传编译产物
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kmod-rkp-ipid-${{ github.event.inputs.kernelVersion }}-ipq60xx
          path: ${{ steps.compile.outputs.ipk_path }}
          retention-days: 30

      - name: 上传错误日志（编译失败时）
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs-${{ github.run_id }}
          path: |
            sdk/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq60xx/rkp-ipid-*/.compile.log
            sdk/logs/
          retention-days: 7
