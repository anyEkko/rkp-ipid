name: 编译rkp-ipid模块 (JDCloud RE-SS-01/aarch64)

on:
  workflow_dispatch:
    inputs:
      unused:
        description: '无需输入，直接触发'
        required: false
        default: '触发编译'

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CROSS_COMPILE: aarch64-linux-gnu-
      ARCH: aarch64

    steps:
      - name: 检查rkp-ipid源码
        uses: actions/checkout@v4
        with:
          path: rkp-ipid
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update --quiet=2
          sudo apt-get upgrade --yes --quiet=2
          sudo apt-get install --yes --quiet=2 \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget \
            unzip python3 python3-distutils file flex bison \
            gcc-aarch64-linux-gnu=4:11.2.0-1ubuntu1 g++-aarch64-linux-gnu=4:11.2.0-1ubuntu1 \
            zstd
          
          if ! command -v ${{ env.CROSS_COMPILE }}gcc &> /dev/null; then
            echo "错误：aarch64交叉编译器安装失败"
            exit 1
          fi

      - name: 下载并解压SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget --no-check-certificate -c --progress=bar:force $SDK_URL -O sdk.tar.zst
          [ -f "sdk.tar.zst" ] && [ $(stat -c%s "sdk.tar.zst") -gt 1024000 ] || { echo "SDK无效"; exit 1; }
          
          rm -rf sdk
          tar --use-compress-program=zstd -xf sdk.tar.zst
          TOP_DIR=$(ls -d immortalwrt-sdk-*)
          mv "$TOP_DIR" sdk
          if [ -z "$(find sdk/target/linux/ -name "kernel-*" | head -n1)" ]; then
            echo "SDK无默认内核目录，解压失败"
            exit 1
          fi

      - name: 配置编译参数（用SDK默认内核）
        run: |
          mkdir -p sdk/package/rkp-ipid
          cp -r rkp-ipid/* sdk/package/rkp-ipid/
          
          cd sdk
          cat > .config << EOF
          CONFIG_ARCH=${{ env.ARCH }}
          CONFIG_CROSS_COMPILE=${{ env.CROSS_COMPILE }}
          CONFIG_PACKAGE_kmod-rkp-ipid=y
          CONFIG_MODULES=y
          CONFIG_KERNEL_BUILD_DIR=$(pwd)/build_dir/target-${{ env.ARCH }}_cortex-a53_musl/linux-*/
          EOF
          
          make defconfig IGNORE_ERRORS=1
          echo "=== SDK默认内核版本 ==="
          cat .config | grep "KERNEL_PATCHVER"

      - name: 编译rkp-ipid模块
        id: compile
        run: |
          cd sdk
          make package/rkp-ipid/compile \
            ARCH=${{ env.ARCH }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            IGNORE_ERRORS=1 \
            -j4 V=sc
          
          IPK_FILE=$(find . -name "kmod-rkp-ipid_*.ipk" | grep -E "${{ env.ARCH }}|arm64" | head -n1)
          if [ -z "$IPK_FILE" ]; then
            echo "未找到产物，当前ipk列表："
            find . -name "*.ipk" | grep -E "${{ env.ARCH }}|arm64"
            exit 1
          fi
          echo "ipk_path=$IPK_FILE" >> $GITHUB_OUTPUT

      # 拆分步骤1：获取SDK内核版本（存入环境变量）
      - name: 获取SDK内核版本
        run: |
          SDK_KERNEL=$(grep "KERNEL_PATCHVER" sdk/.config | awk -F= '{print $2}')
          echo "SDK_KERNEL=$SDK_KERNEL" >> $GITHUB_ENV
          echo "SDK内核版本：$SDK_KERNEL"

      # 拆分步骤2：上传产物（单独使用uses，不嵌套run）
      - name: 上传产物（标注SDK内核版本）
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kmod-rkp-ipid-${{ env.ARCH }}-sdk-kernel-${{ env.SDK_KERNEL }}
          path: ${{ steps.compile.outputs.ipk_path }}
          retention-days: 30

      - name: 上传错误日志
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: |
            sdk/logs/
            sdk/build_dir/target-${{ env.ARCH }}_cortex-a53_musl/linux-*/rkp-ipid-*/
          retention-days: 7
