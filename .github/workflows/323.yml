name: Compile rkp-ipid for JDCloud RE-SS-01 (ipq60xx)

on:
  workflow_dispatch:  # 手动触发编译

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rkp-ipid code
        uses: actions/checkout@v4
        with:
          path: rkp-ipid

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -y \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget \
            unzip python3 python3-distutils file

      - name: Download ImmortalWrt Snapshot SDK (qualcommax/ipq60xx)
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          wget -q --no-check-certificate $SDK_URL -O sdk.tar.xz
          tar xf sdk.tar.xz
          mv immortalwrt-sdk-* sdk

      - name: Prepare rkp-ipid package
        run: |
          cp -r rkp-ipid sdk/package/

      - name: Configure build options
        run: |
          cd sdk
          cp configs/immortalwrt_qualcommax_ipq60xx_defconfig .config
          echo "CONFIG_PACKAGE_kmod-rkp-ipid=y" >> .config
          echo "CONFIG_KERNEL_VERSION=6.1.34" >> .config
          make defconfig

      - name: Compile the module
        run: |
          cd sdk
          make package/rkp-ipid/compile V=sc -j$(nproc)

      - name: Upload compiled package
        uses: actions/upload-artifact@v4  # 已升级为 v4 版本
        with:
          name: rkp-ipid-jdcloud-re-ss-01
          path: sdk/bin/packages/aarch64_cortex-a53/base/kmod-rkp-ipid_*.ipk
          retention-days: 7  # 可选：设置 artifact 保留天数（默认 90 天）
